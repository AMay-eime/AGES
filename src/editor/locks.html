<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>🔒 ロックマネージャー — AGES</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1d1a24; --panel: #26222f; --panel2: #302b3b; --line: #3e3750; --text: #e2dcef; --dim: #9a91ad;
    --accent: #c792ea; --warn: #ffb02e; --bad: #ff5d73; --good: #5fd38d;
    --font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --mono: 12px/1.5 ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1d1a24; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  input, textarea { background: #17141d; border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; min-width: 0; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  header { position: sticky; top: 0; background: #17141d; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; }
  header .spacer { flex: 1; }
  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 60px; }
  .muted { color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin: 12px 0; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .warn { border-color: var(--bad); }
  .mono { font: var(--mono); }
  .group { margin-top: 16px; color: var(--dim); font-size: 12px; letter-spacing: .05em; }
  .item { display: grid; grid-template-columns: minmax(220px, 1.3fr) minmax(200px, 1.5fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .item.focus { background: #3a2f4d; outline: 1px solid var(--accent); border-radius: 4px; }
  .item .path { font: var(--mono); word-break: break-all; }
  .item .meta { font-size: 11px; color: var(--dim); }
  .item textarea { width: 100%; font: var(--mono); min-height: 60px; }
  .item img { max-width: 120px; max-height: 80px; background: repeating-conic-gradient(#302b3b 0% 25%, #26222f 0% 50%) 50% / 12px 12px; }
  .problem { color: var(--bad); font-size: 12px; }
  #toasts { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
  .toast { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 4px; max-width: 440px; white-space: pre-wrap; }
  .toast.bad { border-left-color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🔒 ロックマネージャー</h1>
  <span class="muted" id="project"></span>
  <span class="spacer"></span>
  <span class="muted">名前</span><input id="user" style="width:120px" title="操作ログに残るあなたの名前">
</header>
<main id="main"></main>
<div id="toasts"></div>
<script type="module" src="/locks.ts"></script>
</body>
</html>
