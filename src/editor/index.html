<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AGES</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">{ "imports": { "ages": "/index.ts" } }</script>
<style>
  :root {
    --bg: #1b1d23; --panel: #23262e; --panel2: #2b2f39; --line: #363b47; --text: #d9dde7; --dim: #8a91a3;
    --accent: #4fa3ff; --warn: #ffb02e; --bad: #ff5d73; --good: #5fd38d; --lock: #c792ea;
    --font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --mono: 12px/1.5 ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: 1px 6px; border-color: transparent; background: transparent; }
  button.icon:hover { border-color: var(--line); }
  input, select, textarea { background: #15171c; border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type=range] { padding: 0; accent-color: var(--accent); }
  input[type=color] { padding: 0 2px; height: 22px; width: 40px; }
  #app { display: grid; height: 100vh; grid-template-rows: 36px 1fr; }
  #top { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #15171c; border-bottom: 1px solid var(--line); }
  #top .title { font-weight: 700; letter-spacing: .04em; }
  #top .title small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  #top .spacer { flex: 1; }
  #top .status { color: var(--dim); font: var(--mono); }
  #work { display: grid; min-height: 0; grid-template-columns: var(--left, 260px) 4px 1fr 4px var(--right, 340px); grid-template-rows: 1fr 4px var(--bottom, 200px); }
  .split { background: var(--line); }
  .split.v { cursor: col-resize; grid-row: 1 / 4; }
  .split.h { cursor: row-resize; grid-column: 3; }
  .area { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
  .area[data-area=left] { grid-column: 1; grid-row: 1 / 4; }
  .area[data-area=center] { grid-column: 3; grid-row: 1; }
  .area[data-area=bottom] { grid-column: 3; grid-row: 3; }
  .area[data-area=right] { grid-column: 5; grid-row: 1 / 4; }
  .tabs { display: flex; gap: 1px; background: #1e2128; border-bottom: 1px solid var(--line); min-height: 28px; overflow-x: auto; }
  .tabs.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .tab { padding: 5px 12px; color: var(--dim); cursor: pointer; white-space: nowrap; user-select: none; border-right: 1px solid var(--line); }
  .tab.active { color: var(--text); background: var(--panel); box-shadow: inset 0 2px 0 var(--accent); }
  .panel { flex: 1; overflow: auto; min-height: 0; display: none; }
  .panel.active { display: block; }
  .panel.fill.active { display: flex; flex-direction: column; }
  .pad { padding: 8px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .muted { color: var(--dim); }
  .list .item { padding: 3px 8px; cursor: pointer; border-radius: 3px; display: flex; gap: 6px; align-items: center; }
  .list .item:hover { background: var(--panel2); }
  .list .item.sel { background: #2f4a6b; }
  .list .folder { padding: 6px 8px 2px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .comp { border-bottom: 1px solid var(--line); }
  .comp > .head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel2); font-weight: 600; }
  .comp > .head .desc { font-weight: 400; color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field { display: grid; grid-template-columns: 110px 1fr auto; gap: 6px; align-items: center; padding: 3px 8px; }
  .field label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field.default label { font-style: italic; }
  .field.touched label::after { content: " ★"; color: var(--warn); }
  .field.locked { background: rgba(199, 146, 234, .08); }
  .field.locked label { color: var(--lock); }
  .locked-value { opacity: .65; }
  [inert] { cursor: not-allowed; }
  .field .ctl { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .field .ctl > input[type=number] { width: 72px; }
  .field .ctl > input[type=range] { flex: 1; }
  .field .ctl > input[type=text], .field .ctl > select { flex: 1; }
  .lockbtn { opacity: .35; }
  .field:hover .lockbtn, .lockbtn.on { opacity: 1; }
  .lockbtn.on { color: var(--lock); }
  .game-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #0e0f13; min-height: 0; position: relative; }
  .game-screen { position: relative; overflow: hidden; background: #000; flex: none; box-shadow: 0 0 0 1px var(--line); }
  .game-screen canvas { position: absolute; image-rendering: pixelated; }
  .game-hud { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-bottom: 1px solid var(--line); flex: none; min-height: 26px; }
  .game-hud-text { font: var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .game-hud select, .game-hud button { font-size: 12px; padding: 1px 4px; }
  .toolbar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  textarea.code { flex: 1; width: 100%; resize: none; border: 0; border-radius: 0; font: var(--mono); padding: 8px; tab-size: 2; }
  pre { font: var(--mono); margin: 0; white-space: pre-wrap; }
  .log .line { font: var(--mono); padding: 1px 8px; white-space: nowrap; }
  .log .line .undo-tx { visibility: hidden; margin-left: 6px; }
  .log .line:hover .undo-tx { visibility: visible; }
  .log .who-human { color: var(--good); }
  .log .who-ai { color: var(--accent); }
  .log .who-system { color: var(--lock); }
  #toasts { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
  .toast { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 4px; max-width: 440px; box-shadow: 0 4px 16px #0006; white-space: pre-wrap; }
  .toast.bad { border-left-color: var(--bad); }
  .toast.lock { border-left-color: var(--lock); }
  /* 表のエディタ */
  .table-bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .table-bar .spacer { flex: 1; }
  .table-body { flex: 1; display: flex; min-height: 0; }
  .table-grid { flex: 1; overflow: auto; min-width: 0; }
  .table-grid table { border-collapse: collapse; font-size: 12px; }
  .table-grid th { position: sticky; top: 0; background: var(--panel2); color: var(--dim); font-weight: 600; text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; z-index: 1; }
  .table-grid td { border-bottom: 1px solid #2c3039; border-right: 1px solid #2c3039; padding: 1px 3px; vertical-align: middle; white-space: nowrap; position: relative; }
  .table-grid tr.sel td { background: #2f4a6b55; }
  .table-grid td.default { opacity: 0.6; }
  .table-grid td.touched { box-shadow: inset 2px 0 0 var(--warn); }
  .table-grid td.locked { box-shadow: inset 2px 0 0 var(--lock); }
  .table-grid td .ctl { margin: 0; }
  .table-grid td input[type=number] { width: 72px; }
  .table-grid td input[type=range] { display: none; }
  .table-grid td input[type=text], .table-grid .cell-in { width: 110px; }
  .table-grid td.cplx { color: var(--dim); font: var(--mono); cursor: pointer; }
  .table-grid td.rowno { text-align: right; }
  .table-grid .lockmark { position: absolute; right: 1px; top: 0; font-size: 9px; }
  .table-side { width: 380px; flex: none; overflow: auto; border-left: 1px solid var(--line); }
  /* 入れ子の値（リスト・構造体・どれか1つ） */
  .nest { border-left: 2px solid var(--line); padding-left: 6px; margin: 2px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .nest-head { display: flex; align-items: center; gap: 4px; }
  .nest-row { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
  .nest-label { color: var(--dim); font: var(--mono); min-width: 34px; padding-top: 3px; white-space: nowrap; }
  .nest-val { flex: 1; min-width: 0; }
  .nest-val .ctl { margin: 0; }
  .nest-val select { min-width: 72px; flex: 1; }
  .nest input[type=range] { display: none; }
  .nest input[type=number] { width: 70px; min-width: 56px; flex: none; }
  .nest input[type=text] { min-width: 80px; }
  .field > * { min-width: 0; }
  /* 入れ子の値は、名前の下に幅いっぱいで並べる */
  .field.wide { grid-template-columns: 1fr auto; }
  .field.wide > label { grid-column: 1; grid-row: 1; }
  .field.wide > .lockbtn { grid-column: 2; grid-row: 1; }
  .field.wide > .nest { grid-column: 1 / -1; grid-row: 2; margin-left: 8px; }
  .nest .row-open, .table-grid .row-open { display: none; }
  button.icon.tiny { padding: 0 4px; font-size: 11px; min-width: 0; }
  /* 切り方（スプライトエディタ） */
  .sprite-bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
  .sprite-body { flex: 1; display: flex; min-height: 0; }
  .sprite-scroll { flex: 1; overflow: auto; background: #0e0f13; padding: 12px; min-width: 0; }
  .sprite-canvas { display: block; cursor: crosshair; outline: none; box-shadow: 0 0 0 1px var(--line); }
  .sprite-side { width: 310px; flex: none; overflow: auto; border-left: 1px solid var(--line); }
  .sprite-sec { padding: 8px; border-bottom: 1px solid var(--line); }
  .sprite-h { font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .sprite-h .spacer { flex: 1; }
  .sprite-list { max-height: 240px; overflow: auto; font: var(--mono); }
  .sprite-list .item { display: flex; gap: 4px; padding: 1px 4px; cursor: pointer; border-radius: 3px; }
  .sprite-list .item:hover { background: var(--panel2); }
  .sprite-list .item.sel { background: #2f4a6b; }
  .sprite-hint { padding: 3px 8px; border-top: 1px solid var(--line); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
  .sprite-err { color: var(--bad); padding: 8px; font-size: 12px; white-space: pre-wrap; }
  .sprite-preview { display: block; margin: 6px auto 0; border: 1px solid var(--line); }
  .clip { padding: 4px; border-radius: 4px; margin-bottom: 4px; }
  .clip.sel { background: #5fd38d14; outline: 1px solid #5fd38d55; }
  .seg { display: flex; margin-bottom: 4px; }
  .seg button { flex: 1; border-radius: 0; }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  .asset-thumb { width: 28px; height: 28px; object-fit: contain; image-rendering: pixelated; background: #0006; border: 1px solid var(--line); border-radius: 3px; flex: none; cursor: pointer; }
  .frame-grid { image-rendering: pixelated; background-color: #0008 !important; }
  .frame-cell { position: absolute; padding: 0; margin: 0; border: 1px solid #fff2; background: transparent; border-radius: 0; cursor: pointer; }
  .frame-cell:hover { border-color: #fff; background: #fff2; }
  .frame-cell.on { border: 2px solid #ffb02e; background: #ffb02e33 !important; }
  .modal-bg { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 380px; max-width: 640px; max-height: 80vh; overflow: auto; }
  .modal h3 { margin: 0 0 10px; font-size: 15px; }
  .capture-area { border: 2px dashed var(--accent, #4c8dff); border-radius: 6px; padding: 28px 16px; text-align: center; white-space: pre-line; cursor: crosshair; user-select: none; }
  .input-label { font-size: 11px; white-space: nowrap; }
  .menu { position: fixed; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; z-index: 30; padding: 4px 0; box-shadow: 0 4px 16px #0006; }
  .menu div { padding: 4px 14px; cursor: pointer; }
  .menu div:hover { background: var(--accent); }
  .issues { color: var(--bad); font: var(--mono); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.matrix { border-collapse: collapse; font: var(--mono); }
  table.matrix th { color: var(--dim); font-weight: 400; padding: 2px 6px; text-align: center; min-width: 24px; }
  table.matrix td { padding: 1px; border: 1px solid transparent; }
  table.matrix td.changed { border-color: var(--warn); }
  table.matrix input[type=text] { width: 48px; text-align: center; padding: 3px 2px; border-radius: 2px; }
  table.matrix input[type=checkbox] { width: 18px; height: 18px; margin: 3px 14px; }
  body.solo #work { display: flex; flex-direction: column; }
  body.solo #work > .panel { display: flex; flex-direction: column; flex: 1; background: var(--panel); }
  /* アセット */
  .assets { outline: none; }
  .assets .crumbs a { cursor: pointer; color: var(--accent); }
  .asset-body { flex: 1; display: flex; min-height: 0; }
  .asset-tree { width: 170px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 4px 0; }
  .tree-item { white-space: nowrap; cursor: pointer; padding: 1px 6px; overflow: hidden; text-overflow: ellipsis; }
  .tree-item:hover { background: var(--panel2); }
  .tree-item.on { background: #2d4a6e; }
  .tree-item .twisty { display: inline-block; width: 12px; color: var(--dim); }
  .asset-grid { flex: 1; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 6px; }
  .asset-grid .empty { padding: 16px; }
  .tile { width: 84px; border: 1px solid transparent; border-radius: 4px; padding: 3px; cursor: pointer; text-align: center; }
  .tile:hover { background: var(--panel2); }
  .tile.on { border-color: var(--accent); background: #26354a; }
  .tile.unused .tile-name { opacity: .7; }
  .tile-pic { height: 60px; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(#2b2f39 0% 25%, #23262e 0% 50%) 50% / 12px 12px; border-radius: 3px; position: relative; }
  .tile.folder .tile-pic { background: none; }
  .tile-pic img { max-width: 100%; max-height: 100%; }
  .tile-icon { font-size: 22px; }
  .tile-play { position: absolute; right: 2px; bottom: 2px; font-size: 11px; }
  .tile-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .tile-meta { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asset-side { width: 240px; flex: none; overflow: auto; border-left: 1px solid var(--line); padding: 6px 8px; }
  .side-pic { height: 110px; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(#2b2f39 0% 25%, #23262e 0% 50%) 50% / 12px 12px; border-radius: 3px; margin-bottom: 4px; }
  .side-pic img { max-width: 100%; max-height: 100%; }
  .side-path { font: var(--mono); word-break: break-all; }
  .font-sample { font-size: 20px; padding: 6px; border: 1px solid var(--line); border-radius: 3px; outline: none; }
  ul.refs { margin: 4px 0; padding-left: 16px; font: var(--mono); font-size: 11px; }
  ul.refs a { cursor: pointer; color: var(--accent); }
  .drop-on { outline: 2px dashed var(--accent); outline-offset: -2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  .drop-hint { border: 1px dashed var(--line); margin: 8px; padding: 10px; text-align: center; color: var(--dim); border-radius: 4px; }
  .drop-hint.over { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="work"></div>
</div>
<div id="toasts"></div>
<script type="module" src="/editor/main.ts"></script>
</body>
</html>
